<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Sniper Hunter</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1> FOREST SNIPER 🦌</h1>
            <p>Berburu di Hutan Liar</p>
            <button id="start-btn" class="btn-primary">MULAI BERBURU</button>
            <div class="instructions">
                <h3>Cara Bermain:</h3>
                <ul>
                    <li>Cari senjata secara random di hutan</li>
                    <li>Buru hewan untuk dapat poin</li>
                    <li>Simpan hasil buruan ke database</li>
                </ul>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div id="hud">
                <div class="hud-left">
                    <div id="score">Score: 0</div>
                    <div id="weapon-display">Weapon: None</div>
                </div>
                <div class="hud-right">
                    <div id="ammo">Ammo: ∞</div>
                    <div id="time">Time: 00:00</div>
                </div>
            </div>

            <div id="forest-map">
                <canvas id="game-canvas"></canvas>
                <div id="crosshair"></div>
            </div>

            <div id="inventory">
                <h3>Inventory</h3>
                <div id="weapon-slots">
                    <div class="slot" data-weapon="axe">🪓 Kapak</div>
                    <div class="slot" data-weapon="bow"> Panah</div>
                    <div class="slot" data-weapon="sniper">🔫 Sniper</div>
                </div>
            </div>

            <div id="controls">
                <button id="save-btn" class="btn-secondary">💾 Save Game</button>
                <button id="menu-btn" class="btn-secondary"> Menu</button>
            </div>
        </div>

        <!-- Menu Screen -->
        <div id="menu-screen" class="screen">
            <h2>Menu</h2>
            <button id="resume-btn" class="btn-primary">Lanjut Bermain</button>
            <button id="leaderboard-btn" class="btn-primary"> Leaderboard</button>
            <button id="new-game-btn" class="btn-primary">🔄 Game Baru</button>
        </div>

        <!-- Leaderboard Screen -->
        <div id="leaderboard-screen" class="screen">
            <h2>🏆 Leaderboard</h2>
            <div id="leaderboard-list"></div>
            <button id="back-menu-btn" class="btn-primary">Kembali</button>
        </div>

        <!-- Notification -->
        <div id="notification"></div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Game Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/weapons.js"></script>
    <script src="js/animals.js"></script>
    <script src="js/map.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
