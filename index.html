<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Sniper Hunter 3D - FPS</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            background: #000;
        }

        #blocker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
        }

        #blocker.hidden {
            display: none !important;
        }

        #instructions {
            text-align: center;
            color: white;
            padding: 40px;
        }

        #instructions h1 {
            font-family: 'Press Start 2P', cursive;
            color: #FFD700;
            font-size: 36px;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0 #8B4513;
        }

        #instructions .start-text {
            font-size: 24px;
            margin-bottom: 30px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #instructions .controls-info {
            font-size: 16px;
            line-height: 2;
            color: #ccc;
        }

        .key {
            background: #444;
            padding: 5px 15px;
            border-radius: 5px;
            border: 2px solid #666;
            display: inline-block;
            margin: 2px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            color: #FFD700;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: space-between;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            z-index: 100;
            pointer-events: none;
            color: white;
        }

        .hud-left, .hud-right {
            display: flex;
            gap: 20px;
        }

        #crosshair-3d {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }

        #crosshair-3d::before,
        #crosshair-3d::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 2px rgba(0,0,0,0.8);
        }

        #crosshair-3d::before {
            width: 2px;
            height: 20px;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }

        #crosshair-3d::after {
            width: 20px;
            height: 2px;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }

        #inventory {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #FFD700;
            z-index: 100;
            color: white;
        }

        #inventory h3 {
            margin: 0 0 10px 0;
            color: #FFD700;
        }

        #weapon-slots {
            display: flex;
            gap: 10px;
        }

        .slot {
            padding: 10px 15px;
            background: #333;
            border: 2px solid #666;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .slot.active {
            background: #FFD700;
            color: #000;
            border-color: #FFA500;
        }

        .slot:hover {
            transform: scale(1.05);
        }

        #controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .btn-secondary {
            padding: 10px 20px;
            background: #4a4a4a;
            color: white;
            border: 2px solid #666;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
        }

        .btn-secondary:hover {
            background: #5a5a5a;
        }

        #notification {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 40px;
            border-radius: 10px;
            border: 2px solid #FFD700;
            display: none;
            z-index: 1000;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8em;
        }

        #error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            color: white;
            z-index: 10000;
            display: none;
            max-width: 600px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="blocker">
        <div id="instructions">
            <h1>🌲 FOREST SNIPER 3D 🦌</h1>
            <p class="start-text">🖱️ KLIK UNTUK MULAI BERMAIN</p>
            <div class="controls-info">
                <p>
                    Gerakan: <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span><br/>
                    Lompat: <span class="key">SPACE</span><br/>
                    Aim: Mouse<br/>
                    Tembak: <span class="key">KLIK KIRI</span><br/>
                    Ganti Senjata: <span class="key">1</span><span class="key">2</span><span class="key">3</span><br/>
                    Pause: <span class="key">ESC</span>
                </p>
            </div>
        </div>
    </div>

    <div id="game-container"></div>

    <div id="hud">
        <div class="hud-left">
            <div id="score">Score: 0</div>
            <div id="weapon-display">Weapon: None</div>
            <div id="health">❤️ Health: 100</div>
        </div>
        <div class="hud-right">
            <div id="ammo">Ammo: ∞</div>
            <div id="time">Time: 00:00</div>
        </div>
    </div>

    <div id="inventory">
        <h3> Inventory</h3>
        <div id="weapon-slots">
            <div class="slot" data-weapon="axe">🪓 Kapak</div>
            <div class="slot" data-weapon="bow">🏹 Panah</div>
            <div class="slot" data-weapon="sniper">🔫 Sniper</div>
        </div>
    </div>

    <div id="controls">
        <button id="save-btn" class="btn-secondary">💾 Save</button>
        <button id="menu-btn" class="btn-secondary">📋 Menu</button>
    </div>

    <div id="crosshair-3d"></div>
    <div id="notification"></div>
    <div id="error-message"></div>

    <!-- Three.js dari CDN yang stabil -->
     <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Three.js dari CDN yang stabil -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- TAMBAHKAN BARIS INI (PointerLockControls) -->
    <script src="js/PointerLockControls.js"></script>
    
    <!-- Game Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/weapons.js"></script>
    <script src="js/animals.js"></script>
    <script src="js/map3d.js"></script>
    <script src="js/game3d.js"></script>
</body>
</html>
